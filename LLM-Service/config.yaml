# Pluggable Text & Image Model Architecture
text_model:
  provider: "ollama"           # Options: "ollama", "lmstudio", "openai", "vllm", "mock"
  model_name: "dolphin-llama3"     # e.g., "dolphin-llama3", "qwen2.5:3b", "gpt-4o-mini"
  base_url: "http://localhost:11434"
  temperature: 0.8
  api_key: ""                  # Required for OpenAI provider or cloud models

image_model:
  provider: "pollinations"     # Options: "pollinations" (free Flux), "venice", "sd_webui"
  model_name: "flux-realism"   # "flux-realism" (highest photorealism & prompt accuracy), "flux"
  output_dir: "./generated_images"
  base_url: "http://127.0.0.1:7860"
